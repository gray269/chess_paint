name: Déployer Chess Paint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Tester le collage PGN
        run: npm run test:pgn

      - name: Construire l’application
        run: npm run build

      - name: Vérifier le site construit
        run: |
          test -f dist/index.html
          test -d dist/assets
          grep -q "Chess Paint" dist/index.html

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site construit
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
